# Activates application-test.yaml. That file used to be called application.yaml, which
# shadowed the main one instead of adding to it — same classpath name, test resources first —
# so tests ran without spring.mvc.problemdetails, ddl-auto: validate, or the multipart limits.
# Keeping the test overrides in a profile document lets both files load.
#
# This file must not be application.yaml, or the shadowing comes straight back.
spring.profiles.active=test
