openapi: 3.1.0
info:
  title: Label Manager API
  version: 0.1.0
  description: |
    REST API for the Label Manager application.

    This spec is the source of truth for the contract between frontend and backend.
    Add endpoints here as they are introduced during the Thymeleaf → React migration.

paths:
  /login:
    post:
      operationId: login
      summary: Authenticate a user and start a session
      description: |
        Accepts form-encoded credentials. On success the server sets a session
        cookie (JSESSIONID) in the response. This endpoint is unauthenticated —
        no session is required to call it.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful. Session cookie is set in the response.
        '401':
          description: Invalid username or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /logout:
    post:
      operationId: logout
      summary: Invalidate the current session
      description: |
        Ends the authenticated session. Requires an active session cookie.
      responses:
        '200':
          description: Logout successful. Session has been invalidated.
        '401':
          description: No active session.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/auth/register:
    post:
      operationId: register
      summary: Create an account
      description: |
        Creates a user and returns immediately — it does not start a session.
        The caller logs in separately via `POST /login`. This endpoint is
        unauthenticated and exempt from CSRF.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created. The response has no body.
        '409':
          description: An account with this email already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/session:
    get:
      operationId: getSession
      summary: Get the currently authenticated user
      description: |
        Returns the username of the user associated with the current session.
        Used by the frontend to determine whether the user is logged in and who they are.
      responses:
        '200':
          description: The user is authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Not authenticated — no valid session cookie present.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - displayName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        displayName:
          type: string

    SessionResponse:
      type: object
      required:
        - username
      properties:
        username:
          type: string

    ProblemDetail:
      description: |
        RFC 9457 problem details. Every error response in this API uses this shape,
        served as `application/problem+json`.
      type: object
      required:
        - status
      properties:
        type:
          type: string
          format: uri
          default: 'about:blank'
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri

security:
  - cookieAuth: []
