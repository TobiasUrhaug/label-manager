openapi: 3.1.0
info:
  title: Label Manager API
  version: 0.1.0
  description: |
    REST API for the Label Manager application.

    This spec is the source of truth for the contract between frontend and backend.
    Add endpoints here as they are introduced during the Thymeleaf → React migration.

paths:
  /login:
    post:
      operationId: login
      summary: Authenticate a user and start a session
      description: |
        Accepts form-encoded credentials. On success the server sets a session
        cookie (JSESSIONID) in the response. This endpoint is unauthenticated —
        no session is required to call it.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful. Session cookie is set in the response.
        '401':
          description: Invalid username or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /logout:
    post:
      operationId: logout
      summary: Invalidate the current session
      description: |
        Ends the session. Requires a valid CSRF token, but not a session — logout is
        permitted to anyone and is idempotent.
      responses:
        '200':
          description: Session invalidated, or there was none to invalidate.
        '403':
          description: The CSRF token was missing or stale.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/auth/register:
    post:
      operationId: register
      summary: Create an account
      description: |
        Creates a user and returns immediately — it does not start a session.
        The caller logs in separately via `POST /login`. This endpoint is
        unauthenticated and exempt from CSRF.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created. The response has no body.
        '400':
          description: A required field was missing or blank, or the body was not valid JSON.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: An account with this email already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/session:
    get:
      operationId: getSession
      summary: Get the currently authenticated user
      description: |
        Returns the username of the user associated with the current session.
        Used by the frontend to determine whether the user is logged in and who they are.
      responses:
        '200':
          description: The user is authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Not authenticated — no valid session cookie present.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/artists:
    get:
      operationId: listArtists
      summary: List the artists belonging to the caller
      description: |
        Scoped to the authenticated user. Replaces the artist list that used to be
        bundled into `GET /api/labels/{labelId}`.
      responses:
        '200':
          description: The caller's artists, possibly empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artist'
    post:
      operationId: createArtist
      summary: Create an artist owned by the caller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistRequest'
      responses:
        '201':
          description: Artist created. The response has no body.

  /api/artists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getArtist
      summary: Get one artist
      responses:
        '200':
          description: The artist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
        '404':
          description: No artist with that id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      operationId: updateArtist
      summary: Replace an artist's details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistRequest'
      responses:
        '204':
          description: Artist updated.
    delete:
      operationId: deleteArtist
      summary: Delete an artist
      responses:
        '204':
          description: Artist deleted.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    Address:
      type: object
      nullable: true
      properties:
        street:
          type: string
        street2:
          type: string
          nullable: true
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string

    Person:
      type: object
      nullable: true
      required:
        - name
      properties:
        name:
          type: string

    Artist:
      type: object
      required:
        - id
        - artistName
        - userId
      properties:
        id:
          type: integer
          format: int64
        artistName:
          type: string
        realName:
          $ref: '#/components/schemas/Person'
        email:
          type: string
          nullable: true
        address:
          $ref: '#/components/schemas/Address'
        userId:
          type: integer
          format: int64

    ArtistRequest:
      description: |
        Address and real name are sent flat and assembled server-side; a blank `street`
        means no address, a blank `realName` means none.
      type: object
      required:
        - artistName
      properties:
        artistName:
          type: string
        realName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        street:
          type: string
          nullable: true
        street2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        country:
          type: string
          nullable: true

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - displayName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        displayName:
          type: string

    SessionResponse:
      type: object
      required:
        - username
      properties:
        username:
          type: string

    ProblemDetail:
      description: |
        RFC 9457 problem details, served as `application/problem+json`.

        Used by every error this application raises deliberately: the security filter
        chain's 401 and 403, and anything `ApiExceptionHandler` maps. An unmapped
        exception still falls through to Spring Boot's `/error` controller, which emits
        `{timestamp, status, error, path}` as `application/json` — that is a bug to be
        closed, not a second documented shape.
      type: object
      required:
        - status
      properties:
        type:
          type: string
          format: uri
          default: 'about:blank'
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri

security:
  - cookieAuth: []
